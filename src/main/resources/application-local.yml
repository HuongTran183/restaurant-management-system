server:
  port: ${APP_BACKEND_PORT:18080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,httpexchanges
  httpexchanges:
    recording:
      enabled: true

spring:
  datasource:
    url: jdbc:mysql://${APP_DB_HOST:localhost}:${APP_DB_PORT:13306}/restaurant_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    show-sql: false

app:
  diagnostics:
    enabled: true
    slow-request-threshold-ms: 1500
  dev-support:
    enabled: true
  bootstrap:
    demo:
      enabled: true
