services:
  mysql:
    image: mysql:8.4
    container_name: restaurant-management-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: restaurant_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: restaurant
      MYSQL_PASSWORD: restaurant
    ports:
      - "${APP_DB_PORT:-13306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: restaurant-management-backend-dev
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_BACKEND_PORT: ${APP_BACKEND_PORT:-18080}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/restaurant_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_QR_PUBLIC_BASE_URL: ${APP_QR_PUBLIC_BASE_URL:-http://127.0.0.1:${APP_FRONTEND_PORT:-15173}/qr}
      APP_BOOTSTRAP_DEMO: "true"
      APP_STORAGE_ROOT: /storage
    ports:
      - "${APP_BACKEND_PORT:-18080}:${APP_BACKEND_PORT:-18080}"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_BACKEND_PORT:-18080}/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - backend_storage:/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:${APP_BACKEND_PORT:-18080}}
    container_name: restaurant-management-frontend-dev
    restart: unless-stopped
    ports:
      - "${APP_FRONTEND_PORT:-15173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_storage:
  mysql_data:
